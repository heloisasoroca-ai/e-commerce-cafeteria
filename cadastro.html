<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro - Café D'or</title>
</head>
<body>
    <header class="cabeçalho">
        <img class="img-logo" src="img/image_a37e33cb.jpg" alt="Logo da Cafeteria Cafés D'or">
        <h1 class="titulo-pagina">Café D'or</h1>
    </header>

    <nav class="menu">
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="produto.html">Produto Detalhes</a></li>
            <li><a href="carrinho.html">Carrinho</a></li>
        </ul>
    </nav>

    <main>
        <form action="#" method="POST" class="form-cadastro">
            <h1>Cadastro & Checkout</h1>


            <fieldset>
                <legend>Dados Pessoais</legend>
                
                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" required class="input-field" placeholder="Ex: Maria Silva">
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" required class="input-field" placeholder="exemplo@cafe.com">
                </div>

                <div class="form-group">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" class="input-field">
                </div>

                <div class="form-group">
                    <label for="tel">Telefone / WhatsApp:</label>
                    <input type="tel" id="tel" required placeholder="(11) 99999-9999" class="input-field">
                </div>

                <div class="form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="senha">Crie uma Senha:</label>
                    <input type="password" id="senha" required minlength="6" class="input-field">
                </div>

                <div class="form-group">
                    <label for="avatar">Foto de Perfil (Opcional):</label>
                    <input type="file" id="avatar" accept="image/*" class="input-field">
                </div>
            </fieldset>


            <fieldset>
                <legend>Endereço de Entrega</legend>

                <div class="form-group">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" required placeholder="00000-000" class="input-field">
                </div>

                <div class="form-group">
                    <label for="rua">Rua/Logradouro:</label>
                    <input type="text" id="rua" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="numero">Número:</label>
                    <input type="text" id="numero" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" class="input-field" placeholder="Apt, Bloco, etc.">
                </div>

                <div class="form-group">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" required class="input-field">
                </div>

                <div class="form-group">
                    <label for="estado">Estado:</label>
                    <select id="estado" required class="input-field">
                        <option value="">Selecione...</option>
                        <option value="SP">São Paulo</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="MG">Minas Gerais</option>
                    </select>
                </div>
            </fieldset>


            <fieldset>
                <legend>Forma de Pagamento</legend>
                <p>Selecione a opção desejada:</p>
                <div class="pagamento-opcoes">
                    <label class="metodo-pay">
                        <input type="radio" name="pagamento" value="pix" required>
                        <span>📱 PIX</span>
                    </label>
                    <label class="metodo-pay">
                        <input type="radio" name="pagamento" value="cartao">
                        <span>💳 Cartão de Crédito</span>
                    </label>
                    <label class="metodo-pay">
                        <input type="radio" name="pagamento" value="boleto">
                        <span>📄 Boleto Bancário</span>
                    </label>
                </div>
            </fieldset>


            <div style="margin: 20px 0;">
                <label>
                    <input type="checkbox" required> Aceito os Termos de Uso e condições de entrega da cafeteria.
                </label>
            </div>

            <button type="submit" class="btn-acao" style="width: 100%;">Concluir Cadastro e Pagar</button>
        </form>
    </main>
</body>
</html>
